# Types, tests, bundle and a packaged VSIX on every PR and on main/dev.
#
# Publish is *not* here — that is `.github/workflows/release.yml`, on a `v*`
# tag only, so the decision to ship stays the person who cuts the tag.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: bytesbrains-cruise-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
