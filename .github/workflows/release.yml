# Ship a tagged release to the Visual Studio Marketplace, Open VSX, and GitHub
# Releases. Triggered only by a `v*` tag (or a manual re-run), never by a merge.
#
# The person cutting the tag is the publish decision. Bump `package.json`
# version and `CHANGELOG.md` on `main` first; the tag must match that version
# (`v0.1.4` ↔ `"version": "0.1.4"`).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VSCE_PAT  — Azure DevOps PAT, Marketplace → Manage, for publisher `bytesbrains`
#   OVSX_PAT  — Open VSX personal access token for the `bytesbrains` namespace
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.4). Leave empty to use the ref that triggered this run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Tag must look like v0.1.4, got: $TAG"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Assert tag matches package.json
        run: |
          set -euo pipefail
          PKG=$(node -p 'require("./package.json").version')
          WANT="${{ steps.tag.outputs.version }}"
          if [ "$PKG" != "$WANT" ]; then
            echo "::error::package.json version is $PKG but tag is v$WANT — bump and retag."
            exit 1
          fi

      - name: Require publish secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT is not set. Add it under Settings → Secrets → Actions."
            missing=1
          fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OVSX_PAT is not set. Add it under Settings → Secrets → Actions."
            missing=1
          fi
          exit "$missing"

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o "bytesbrains-cruise-${{ steps.tag.outputs.version }}.vsix"

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --no-dependencies --packagePath "bytesbrains-cruise-${{ steps.tag.outputs.version }}.vsix"

      - name: Publish to Open VSX
        run: npx ovsx publish "bytesbrains-cruise-${{ steps.tag.outputs.version }}.vsix" --pat "$OVSX_PAT"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          {
            echo "BytesBrains Cruise for VS Code **v${VERSION}**."
            echo
            echo "- [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=BytesBrains.bytesbrains-cruise)"
            echo "- [Open VSX](https://open-vsx.org/extension/bytesbrains/bytesbrains-cruise)"
            echo "- Product: [bytesbrains.com/cruise](https://bytesbrains.com/cruise)"
            echo
            if [ -f CHANGELOG.md ]; then
              # First ## section body after the matching version heading, if present.
              awk -v ver="$VERSION" '
                $0 ~ "^## " ver {grab=1; next}
                grab && /^## / {exit}
                grab {print}
              ' CHANGELOG.md
            fi
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "bytesbrains-cruise-${VERSION}.vsix" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --title "v${VERSION}" \
              --notes-file "$NOTES" \
              "bytesbrains-cruise-${VERSION}.vsix"
          fi
