# Keep Actions and npm deps current. Public repo — Dependabot PRs are free.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Every change goes to dev; main only takes release PRs from dev.
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Stay on the 5.x / 22 lines until we deliberately major-bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # The types are the API of the oldest editor supported, so they move with
      # engines.vscode and never ahead of it — vsce refuses to package when they
      # do, and anything newer typechecks calls that editor does not have.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    # Every change goes to dev; main only takes release PRs from dev.
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
